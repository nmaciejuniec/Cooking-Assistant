# Builds the Android app (APK) and the Mac app (DMG) on every push to main,
# and publishes both in one GitHub release called "latest" (each build replaces the files).
name: Build apps

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'tests/**', 'scripts/test-links.mjs', '.github/workflows/test-links.yml']
  workflow_dispatch:

permissions:
  contents: write

# Builds run one after another, so a running Mac build is never cut off by a newer push.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci
      - name: Copy web app
        run: APP_VERSION="$(TZ=Europe/Copenhagen date '+%d.%m.%Y') (${{ github.run_number }})" node scripts/www.mjs
      - name: Create Android project
        run: npx cap add android
      - name: App icon, home Wi-Fi sync plugin and version
        run: |
          bash scripts/android-native.sh
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      # Every version must be signed with the same key, or Android refuses to install it over the old one.
      - name: Signing key (repository secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Missing secret ANDROID_KEYSTORE_BASE64 (Settings > Secrets and variables > Actions)"; exit 1; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "::error::Missing secret ANDROID_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  cookingAssistant {
                      storeFile file("$RUNNER_TEMP/release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "cookingassistant"
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.cookingAssistant }
              }
          }
          EOF
      - name: Sync plugins
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CookingAssistant.apk
      - name: Check the signing key
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs CookingAssistant.apk | tee certs.txt
          if ! grep -qi "SHA-256 digest: 7c906db24f3c3717d16bb7d5bfa8fa734da05067731c93dc3d61ecb8a41d2d40" certs.txt; then
            echo "::error::The APK is not signed with the Cooking Assistant key, so it would not install over the previous version."
            exit 1
          fi
          echo "::notice::Signed with the Cooking Assistant key (SHA-256 7C:90:6D:B2...2D:40)"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: CookingAssistant.apk

  release-android:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: out
      - name: Publish the APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: BUILD_DATE="$(TZ=Europe/Copenhagen date '+%d %b %Y, %H:%M')" bash scripts/release.sh apk out/CookingAssistant.apk

  # GitHub's Mac machines are sometimes unavailable, so the Mac app is built on
  # both kinds at once; one success is enough (both produce the same universal app).
  mac-arm:
    # Apple Silicon Mac runner
    needs: release-android
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Copy web app
        run: APP_VERSION="$(TZ=Europe/Copenhagen date '+%d.%m.%Y') (${{ github.run_number }})" node scripts/www.mjs
      - name: Build app (Apple Silicon + Intel)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dir --universal --publish never -c.extraMetadata.version=1.0.${{ github.run_number }}
      - name: Sign locally (ad-hoc) and make DMG
        run: |
          APP="$(ls -d dist/mac-universal/*.app | head -1)"
          echo "App: $APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          mkdir dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Cooking Assistant" -srcfolder dmgroot -ov -format UDZO CookingAssistant.dmg
      - name: Add the DMG to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: BUILD_DATE="$(TZ=Europe/Copenhagen date '+%d %b %Y, %H:%M')" bash scripts/release.sh dmg CookingAssistant.dmg

  mac-intel:
    # Intel Mac runner
    needs: release-android
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Copy web app
        run: APP_VERSION="$(TZ=Europe/Copenhagen date '+%d.%m.%Y') (${{ github.run_number }})" node scripts/www.mjs
      - name: Build app (Apple Silicon + Intel)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dir --universal --publish never -c.extraMetadata.version=1.0.${{ github.run_number }}
      - name: Sign locally (ad-hoc) and make DMG
        run: |
          APP="$(ls -d dist/mac-universal/*.app | head -1)"
          echo "App: $APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          mkdir dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Cooking Assistant" -srcfolder dmgroot -ov -format UDZO CookingAssistant.dmg
      - name: Add the DMG to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: BUILD_DATE="$(TZ=Europe/Copenhagen date '+%d %b %Y, %H:%M')" bash scripts/release.sh dmg CookingAssistant.dmg
