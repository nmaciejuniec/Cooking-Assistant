# Builds the Android app (APK) and the Mac app (DMG) on every push to main,
# and publishes both as a GitHub Release (see the Releases section of the repo).
name: Build apps

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'tests/**', 'scripts/test-links.mjs', '.github/workflows/test-links.yml']
  workflow_dispatch:

permissions:
  contents: write

# Builds run one after another, so a running Mac build is never cut off by a newer push.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci
      - name: Copy web app
        run: node scripts/www.mjs
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
      - name: Create Android project
        run: npx cap add android
      - name: App icon and version
        run: |
          cp -r native/android/res/* android/app/src/main/res/
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      # Every version must be signed with the same key, or Android refuses to install it over the old one.
      - name: Signing key (repository secret ANDROID_KEYSTORE_BASE64)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Missing secret ANDROID_KEYSTORE_BASE64 (Settings > Secrets and variables > Actions)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  cookingAssistant {
                      storeFile file("$RUNNER_TEMP/release.keystore")
                      storePassword "cooking-assistant"
                      keyAlias "cookingassistant"
                      keyPassword "cooking-assistant"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.cookingAssistant }
              }
          }
          EOF
      - name: Sync plugins
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CookingAssistant.apk
      - name: Check the signing key
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs CookingAssistant.apk | tee certs.txt
          if ! grep -qi "SHA-256 digest: 7c906db24f3c3717d16bb7d5bfa8fa734da05067731c93dc3d61ecb8a41d2d40" certs.txt; then
            echo "::error::The APK is not signed with the Cooking Assistant key, so it would not install over the previous version."
            exit 1
          fi
          echo "::notice::Signed with the Cooking Assistant key (SHA-256 7C:90:6D:B2...2D:40)"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: CookingAssistant.apk

  mac:
    # Intel Mac runner: GitHub's Apple Silicon runners were not available (capacity).
    # The app is still built for both Apple Silicon and Intel (--universal).
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Copy web app
        run: node scripts/www.mjs
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
      - name: Build app (Apple Silicon + Intel)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dir --universal --publish never -c.extraMetadata.version=1.0.${{ github.run_number }}
      - name: Sign locally (ad-hoc) and make DMG
        run: |
          APP="$(ls -d dist/mac-universal/*.app | head -1)"
          echo "App: $APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          mkdir dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Cooking Assistant" -srcfolder dmgroot -ov -format UDZO CookingAssistant.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: CookingAssistant.dmg

  # Each app is published as soon as it is built, into the same release.
  release-android:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cooking Assistant 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download:
            - **CookingAssistant.apk**: Android tablet / phone
            - **CookingAssistant.dmg**: Mac (Apple Silicon and Intel), added when the Mac build finishes

            Installation steps are in the README.
          files: out/CookingAssistant.apk

  release-mac:
    needs: [mac, release-android]
    if: ${{ !cancelled() && needs.mac.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cooking Assistant 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: out/CookingAssistant.dmg
      # Only the newest release is kept: older releases and their tags are deleted
      # once this release has both the APK and the DMG.
      - name: Keep only the newest release
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: v1.0.${{ github.run_number }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | while read -r t; do
            if [ -n "$t" ] && [ "$t" != "$KEEP" ]; then
              echo "Deleting $t"
              gh release delete "$t" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
          done
