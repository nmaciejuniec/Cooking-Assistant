<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cooking Assistant</title>
<meta name="theme-color" content="#B5532E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&family=DM+Serif+Display&family=Courier+Prime:wght@400;700&family=Cormorant+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7F0; --card:#FFFFFF; --ink:#2B2622; --muted:#7A6F66; --line:#E8DFD3;
  --accent:#B5532E; --accent-soft:#F6E3D9; --ok:#3E7C4F;
  --ai:#6B4FA0; --ai-bg:#F3EEFA; --ai-line:#B9A5DC;
  --surface:#FFFFFF; --on-ink:#FFFFFF; --hover-line:#cbbba8; --hdr:rgba(251,247,240,.96); --bar:rgba(255,255,255,.97);
  --banner-bg:#FFF4D6; --banner-line:#EBD38E; --tag-fg:#8a3d20; --green-bg:#E8F1EA; --green-fg:#2F6B41;
  --gold-bg:#FFF3D6; --gold-line:#E3C478; --danger:#A33; --warn:#9a5b00; --err-bg:#fff6f6; --err-line:#e6b0b0; --off-bg:#f1eeea; --scrim:rgba(43,38,34,.45);
  --radius:14px;
}
:root{color-scheme:light}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#181513; --card:#221E1B; --surface:#2A2522; --ink:#EEE7E0; --muted:#A99E94; --line:#3A332F;
  --accent:#C9653D; --accent-soft:#3B2A22; --ok:#7FBF91; --on-ink:#181513;
  --ai:#C3AEEC; --ai-bg:#2A2433; --ai-line:#6F5C99; --hover-line:#5A4F49;
  --hdr:rgba(24,21,19,.94); --bar:rgba(34,30,27,.97);
  --banner-bg:#3A311B; --banner-line:#6B5A2A; --tag-fg:#EDB79F; --green-bg:#1E3326; --green-fg:#9CD3AC;
  --gold-bg:#3A3018; --gold-line:#8A7034; --danger:#F08A80; --warn:#E3B062; --err-bg:#3A2121; --err-line:#7A3B3B; --off-bg:#2E2926; --scrim:rgba(0,0,0,.6);
}
:root[data-theme="dark"] img.icon-img{opacity:.9}
*{box-sizing:border-box}
input[type=checkbox]{accent-color:var(--accent)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;margin:0;line-height:1.15}
a{color:var(--accent)}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 120px}
header.top{position:sticky;top:0;padding-top:env(safe-area-inset-top);z-index:20;background:var(--hdr);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
header.top .wrap{padding-bottom:10px;padding-top:10px}
.row{display:flex;gap:8px;align-items:center}
.wrapflex{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.brand{font-family:Fraunces,serif;font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--hover-line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff);font-weight:600}
.btn.ai{background:var(--ai-bg);border-color:var(--ai-line);color:var(--ai)}
.btn.danger{color:var(--danger)}
.btn.small{padding:5px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{border:none;background:none;cursor:pointer;font-size:20px;padding:6px 8px;border-radius:10px}
.iconbtn:hover{background:var(--accent-soft)}
input[type=text],input[type=password],input[type=search],input[type=url],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px}
textarea{min-height:120px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.banner{background:var(--banner-bg);border:1px solid var(--banner-line);border-radius:10px;padding:8px 12px;font-size:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;transition:transform .08s}
.card:hover{transform:translateY(-1px);border-color:var(--hover-line)}
.card h3{font-size:18px;margin-bottom:6px}
.meta{font-size:13px;color:var(--muted)}
.tag{display:inline-block;background:var(--accent-soft);color:var(--tag-fg);border-radius:6px;padding:1px 7px;font-size:12px;margin:2px 3px 0 0}
.aitag{display:inline-block;background:var(--ai-bg);color:var(--ai);border:1px dashed var(--ai-line);border-radius:6px;padding:0 6px;font-size:12px}
.stattag{display:inline-block;background:var(--green-bg);color:var(--green-fg);border-radius:6px;padding:1px 7px;font-size:12px;margin:4px 0 2px}
.statbtn.on{background:var(--gold-bg);border-color:var(--gold-line);font-weight:600}
.asstbtn{width:100%;margin-top:8px;text-align:left;background:var(--ai-bg);border:1px solid var(--ai-line);color:var(--ai);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600}
.msgs{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.bub{max-width:90%;padding:10px 13px;border-radius:16px}
.bub.u{align-self:flex-end;background:var(--ink);color:var(--on-ink);border-bottom-right-radius:4px;white-space:pre-wrap}
.bub.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.err{border-color:var(--err-line);background:var(--err-bg)}
.mini{border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-top:8px;cursor:pointer;background:var(--bg)}
.mini:hover{border-color:var(--hover-line)}
.newr{border:1.5px dashed var(--ai-line);background:var(--ai-bg);border-radius:12px;padding:10px 12px;margin-top:8px}
.memchip{display:inline-flex;gap:4px;align-items:center;background:var(--green-bg);color:var(--green-fg);border-radius:999px;padding:3px 10px;font-size:13px;margin:8px 6px 0 0}
.memchip.off{background:var(--off-bg);color:var(--muted);text-decoration:line-through}
.composer{position:fixed;left:0;right:0;bottom:0;background:var(--bar);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:15}
.composer .inner{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:44px;max-height:140px;resize:none}
.cols{display:block}
@media (min-width:1000px){
  .wrap{max-width:1180px}
  .actionbar .inner{max-width:1180px}
  .composer .inner{max-width:1180px}
  .cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
  .cols>.panel{margin-top:12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .bub{max-width:70%}
}
.catchips{display:contents}
.subchips{padding-top:4px}
.chip.small{font-size:13px;padding:3px 10px}
.listlayout{display:block}
.tree{display:none}
@media (min-width:1000px){
  .catchips,.subchips{display:none}
  .listlayout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
  .listlayout .grid{margin-top:12px}
  .tree{display:block;position:sticky;top:150px;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px;max-height:calc(100vh - 170px);overflow:auto}
  .tree-h{font-family:Fraunces,serif;font-weight:700;font-size:16px;padding:4px 8px 8px}
  .tnode{display:flex;gap:6px;align-items:center;width:100%;border:none;background:none;text-align:left;padding:7px 8px;border-radius:9px;cursor:pointer;font-size:15px}
  .tnode:hover{background:var(--accent-soft)}
  .tnode.on{background:var(--ink);color:var(--on-ink)}
  .tnode.sub{padding-left:30px;font-size:14px}
  .tnode .caret{width:12px;color:var(--muted);font-size:12px}
  .tnode.on .caret{color:inherit}
  .tnode .cnt{font-size:12px;color:var(--muted)}
  .tnode.on .cnt{color:inherit;opacity:.8}
}
.segscroll{overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.segscroll .seg{white-space:nowrap}
.segscroll .seg button{padding:7px 13px}
.stattag{margin-right:4px}
.stattag.flag{background:var(--gold-bg);color:var(--ink)}
.stattag.bad{background:var(--err-bg);color:var(--danger)}
.card.withimg{padding-top:0;overflow:hidden}
.card .thumb{height:140px;margin:0 -14px 12px;background-size:cover;background-position:center;background-color:var(--accent-soft)}
.hero{position:relative;margin-top:14px;border-radius:var(--radius);overflow:hidden;background:var(--accent-soft)}
.hero img{display:block;width:100%;max-height:340px;object-fit:cover}
.hero.svg{background:#FBF7F0}
.hero.svg img{object-fit:contain;height:300px}
.herotag{position:absolute;left:10px;top:10px;background:var(--ai-bg);color:var(--ai);border:1px dashed var(--ai-line);border-radius:999px;padding:2px 10px;font-size:12px}
.heroacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px;background:var(--card);border-top:1px solid var(--line)}
.hero{display:flex;flex-direction:column}
.hero img{flex:1;min-height:0}
.noimg{margin-top:14px;border:2px dashed var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.a5 .pimg{height:130px;border-radius:6px;background-size:cover;background-position:center;margin-bottom:10px}
.rhead{display:grid;gap:16px;margin-top:14px}
.rhead .rimg{order:-1}
.rhead .hero,.rhead .noimg{margin-top:0}
.rinfo .rtitle{margin-top:0}
.facts{display:flex;gap:6px;margin:12px 0;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fact{flex:1;text-align:center;min-width:0}
.fact .ic{font-size:22px;line-height:1.2;color:var(--muted)}
.fact .lb{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-top:2px}
.fact .vl{font-weight:600}
@media (min-width:700px){
  .rhead{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:stretch}
  .rhead.single{grid-template-columns:1fr}
  .rhead .rimg{order:0;display:flex}
  .rhead .hero{flex:1;display:flex;min-height:260px}
  .rhead .hero img{height:100%;max-height:none;min-height:260px;flex:1}
  .rhead .noimg{flex:1;flex-direction:column;justify-content:center;text-align:center}
}

/* ===== Retro recipe-card style (default): one ink colour, framed card, labelled boxes, ruled lines ===== */
:root[data-style="retro"]{
  --c:#3E7B4F; --c-line:rgba(62,123,79,.35); --c-soft:#E4EEE5;
  --bg:#ECE9E1; --card:#F9F7F2; --surface:#FFFEFA; --ink:#2D2A26; --muted:#6F6A60; --line:#D6D1C4; --on-ink:#fff;
  --accent:var(--c); --accent-soft:var(--c-soft); --hover-line:var(--c); --hdr:rgba(236,233,225,.95); --bar:rgba(249,247,242,.97);
  --tag-fg:var(--c); --radius:12px;
}
:root[data-style="retro"][data-ink="red"]{--c:#A63D38; --c-line:rgba(166,61,56,.32); --c-soft:#F4E2DF; --bg:#EBDDD9; --hdr:rgba(235,221,217,.95); --card:#FAF5F3}
:root[data-style="retro"][data-ink="brown"]{--c:#7B4F2E; --c-line:rgba(123,79,46,.33); --c-soft:#F0E5DA; --bg:#EDE4D6; --hdr:rgba(237,228,214,.95); --card:#FBF7F0}
:root[data-style="retro"][data-theme="dark"]{
  --c:#8CC79A; --c-line:rgba(140,199,154,.3); --c-soft:#243A2A;
  --bg:#171815; --card:#20211D; --surface:#262722; --ink:#ECE8DD; --muted:#A8A396; --line:#3A3B35; --on-ink:#171815;
  --hdr:rgba(23,24,21,.94); --bar:rgba(32,33,29,.97);
}
:root[data-style="retro"][data-theme="dark"][data-ink="red"]{--c:#E88F86; --c-line:rgba(232,143,134,.3); --c-soft:#43231F}
:root[data-style="retro"][data-theme="dark"][data-ink="brown"]{--c:#D3A57E; --c-line:rgba(211,165,126,.3); --c-soft:#3D2E21}
:root[data-style="retro"] body{background-color:var(--bg)}
:root[data-style="retro"] h1,:root[data-style="retro"] h2,:root[data-style="retro"] h3,:root[data-style="retro"] .cook-h{font-family:"DM Serif Display",Georgia,serif;font-weight:400}
:root[data-style="retro"] .brand,:root[data-style="retro"] .tree-h,:root[data-style="retro"] .panel h2{font-family:"Cormorant SC",Georgia,serif;font-weight:700;color:var(--c);letter-spacing:.05em}
:root[data-style="retro"] .brand{font-size:30px;line-height:1}
:root[data-style="retro"] .panel{border:1.5px solid var(--c);border-radius:12px;box-shadow:none}
:root[data-style="retro"] .card{border:1.5px solid var(--c);border-radius:12px;box-shadow:none}
:root[data-style="retro"] .card:hover{border-color:var(--c);box-shadow:0 2px 0 var(--c)}
:root[data-style="retro"] .card h3{font-size:21px;padding-bottom:6px;margin-bottom:8px;border-bottom:1.5px solid var(--c)}
:root[data-style="retro"] .card .thumb{border-bottom:1.5px solid var(--c)}
:root[data-style="retro"] .tree{border:1.5px solid var(--c);border-radius:12px}
:root[data-style="retro"] .meta,:root[data-style="retro"] .tag,:root[data-style="retro"] .stattag,:root[data-style="retro"] .aitag,:root[data-style="retro"] .ing li,:root[data-style="retro"] ol.steps li,:root[data-style="retro"] .notes,:root[data-style="retro"] .cook .body,:root[data-style="retro"] .cook label.chk,:root[data-style="retro"] .cook .stepcard,:root[data-style="retro"] .cook .alls li,:root[data-style="retro"] .needchip{font-family:"Courier Prime","Courier New",monospace}
:root[data-style="retro"] .tag{border:1px solid var(--c);color:var(--c);background:transparent;border-radius:3px}
:root[data-style="retro"] .btn.primary,:root[data-style="retro"] .seg button.on,:root[data-style="retro"] .chip.on,:root[data-style="retro"] .tnode.on{background:var(--c);color:var(--on-ink);border-color:var(--c)}
:root[data-style="retro"] .seg,:root[data-style="retro"] .btn,:root[data-style="retro"] .chip,:root[data-style="retro"] input,:root[data-style="retro"] textarea,:root[data-style="retro"] select{border-color:var(--c-line)}
:root[data-style="retro"] .asstbtn{border:1.5px dashed var(--c);background:var(--c-soft);color:var(--c);border-radius:12px;font-family:"DM Serif Display",serif;font-weight:400;font-size:18px}
/* recipe view in card look (same layout as Modern) */
:root[data-style="retro"] .rhead{background:var(--card);border:2px solid var(--c);border-radius:14px;padding:18px}
:root[data-style="retro"] .rtitle{font-size:34px;line-height:1.08}
:root[data-style="retro"] .facts{border-top:1.5px solid var(--c);border-bottom:1.5px solid var(--c)}
:root[data-style="retro"] .fact .ic{color:var(--c)}
:root[data-style="retro"] .fact .lb{font-family:"Cormorant SC",Georgia,serif;color:var(--c);font-size:14px;letter-spacing:.05em}
:root[data-style="retro"] .fact .vl{font-family:"Courier Prime","Courier New",monospace;font-weight:700}
:root[data-style="retro"] .rhead .hero,:root[data-style="retro"] .rhead .noimg{border-radius:10px}
:root[data-style="retro"] .rhead .hero{border:1.5px solid var(--c)}
:root[data-style="retro"] .heroacts{border-top-color:var(--c-line)}
:root[data-style="retro"] .rhead .noimg{border:1.5px dashed var(--c-line)}
:root[data-style="retro"] .panel{border-width:2px;border-radius:14px}
:root[data-style="retro"] .panel h2{font-size:22px!important;padding-bottom:4px;border-bottom:1.5px solid var(--c);margin-bottom:8px}
:root[data-style="retro"] .panel .row h2{border-bottom:none;margin-bottom:0}
:root[data-style="retro"] .ing li{border-bottom:1px solid var(--c-line)}
:root[data-style="retro"] .ing li:last-child{border-bottom:none}
:root[data-style="retro"] ol.steps li{border-bottom:1px solid var(--c-line);padding:4px 0 10px 4px;margin:0 0 8px}
:root[data-style="retro"] ol.steps li:last-child{border-bottom:none}
:root[data-style="retro"] ol.steps li::marker{font-family:"DM Serif Display",serif;color:var(--c);font-size:1.15em}
:root[data-style="retro"] .notes{line-height:28px;background-image:repeating-linear-gradient(transparent 0 27px,var(--c-line) 27px 28px)}
:root[data-style="retro"] .onecard{background:var(--card);border:2px solid var(--c);border-radius:14px;overflow:hidden;margin-top:12px}
:root[data-style="retro"] .onecard .rhead{border:none;border-radius:0;margin:0;padding:18px;background:none}
:root[data-style="retro"] .onecard .cols{border-top:1.5px solid var(--c);gap:0;align-items:stretch}
:root[data-style="retro"] .onecard .panel{border:none;border-radius:0;margin:0;background:none;padding:16px 18px}
:root[data-style="retro"] .onecard .cols>.panel+.panel{border-top:1.5px solid var(--c)}
:root[data-style="retro"] .onecard .notespanel{border-top:1.5px solid var(--c)}
@media (min-width:700px){
  :root[data-style="retro"] .onecard .rhead{grid-template-columns:minmax(0,1fr) minmax(0,300px)}
  :root[data-style="retro"] .onecard .rhead .hero img{min-height:0;max-height:220px}
  :root[data-style="retro"] .onecard .rhead .rimg{align-items:flex-start}
  :root[data-style="retro"] .onecard .rhead .noimg{min-height:200px}
}
@media (max-width:699px){
  :root[data-style="retro"] .onecard .rhead .hero img{max-height:200px}
  :root[data-style="retro"] .fact .lb{font-size:11.5px;letter-spacing:0}
  :root[data-style="retro"] .fact{min-width:0;flex:1}
}
@media (min-width:1000px){:root[data-style="retro"] .onecard .cols>.panel+.panel{border-top:none;border-left:1.5px solid var(--c)}}
/* A5 page in card style */
.a5.rc h1{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:25px;color:#2D2A26}
.a5.rc h4{font-family:"Cormorant SC",Georgia,serif;font-weight:700;font-size:15px;color:var(--pc);letter-spacing:.08em;border-bottom:1.2px solid var(--pc);padding-bottom:2px}
.a5.rc .i{border-bottom:.6px solid var(--pcl);font-family:"Courier Prime","Courier New",monospace}
.a5.rc .s{font-family:"Courier Prime","Courier New",monospace;border-bottom:.6px solid var(--pcl);padding-bottom:4px}
.a5.rc .s .n{color:var(--pc)}
.a5.rc .m{font-family:"Courier Prime","Courier New",monospace}
.a5.rc .pimg{border-radius:8px}
.lanchip{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;margin-right:8px;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.qrbox{width:230px;max-width:70vw;margin:10px auto;background:#fff;padding:6px;border-radius:10px;border:1.5px solid var(--accent)}
.qrbox svg{display:block;width:100%;height:auto}
.words{font-family:"Courier Prime","Courier New",monospace;font-size:14px;line-height:1.7;background:var(--accent-soft);padding:10px 12px;border-radius:8px;user-select:all;-webkit-user-select:all}
.scanvid{width:100%;max-height:60vh;border-radius:10px;background:#000;margin:8px 0}
.stattag.on{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:50px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:none;background:none;padding:6px 12px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--ink);color:var(--on-ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:12px}
.rtitle{font-size:30px;margin:14px 0 6px}
.ing{list-style:none;padding:0;margin:0}
.ing li{padding:7px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px}
.ing li.hdr{font-weight:700;border-bottom:none;padding-top:12px;font-family:Fraunces,serif}
.ing .q{min-width:92px;font-weight:600}
.ing .orig{color:var(--muted);font-size:13px}
ol.steps{padding-left:22px;margin:0}
ol.steps li{margin:0 0 12px;padding-left:4px}
.aibox{background:var(--ai-bg);border:1.5px dashed var(--ai-line);border-radius:var(--radius);padding:14px;margin-top:12px}
.aibox .lbl{color:var(--ai);font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.aibox ul{margin:8px 0 0;padding-left:18px}
.aibox li{margin-bottom:6px}
.notes{white-space:pre-wrap}
.trbanner{background:var(--ai-bg);border:1px dashed var(--ai-line);color:var(--ai);border-radius:10px;padding:8px 12px;font-size:14px;margin-top:10px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bar);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.actionbar .inner{max-width:860px;margin:0 auto;display:flex;gap:8px;overflow-x:auto}
.ctrl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:10px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.stepper button{border:none;background:none;width:34px;height:32px;font-size:18px;cursor:pointer}
.stepper span{min-width:58px;text-align:center;font-weight:600;font-size:14px}
/* modal */
.modal-bg{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.modal-bg{align-items:center}}
.modal{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:18px}
@media(min-width:700px){.modal{border-radius:18px}}
.modal h2{font-size:22px;margin-bottom:8px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--on-ink);padding:9px 16px;border-radius:999px;z-index:60;font-size:14px;max-width:90vw}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:24px;text-align:center;background:var(--surface);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.review{display:flex;gap:10px;align-items:flex-start}
.warn{color:var(--warn);font-size:13px}
.dupe{color:var(--danger);font-size:13px}
.hint-small{font-size:13px;color:var(--muted)}
/* cook mode */
.cook{position:fixed;inset:0;background:var(--card);color:var(--ink);z-index:40;display:flex;flex-direction:column}
.cook .head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.cook .cook-grid{flex:1;min-height:0;display:flex;flex-direction:column}
.cook .cook-ing{max-height:38vh;overflow:auto;padding:10px 16px;border-bottom:1px solid var(--line);font-size:18px;line-height:1.4;background:var(--bg)}
.cook .cook-steps{flex:1;overflow:auto;padding:14px 16px 20px}
.cook .cook-h{font-family:Fraunces,serif;font-weight:700;font-size:18px;margin:4px 0 2px}
.cook .cook-sub{font-weight:700;margin-top:10px;font-size:16px;color:var(--muted)}
.cook label.chk.now{background:var(--accent-soft);border-radius:8px;padding-left:6px;padding-right:6px}
.cook .need{margin:4px 0 14px}
.cook .cookthumb{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none}
.cook .needchip{background:var(--accent-soft);border-radius:999px;padding:6px 12px;font-size:17px}
.cook .alls{padding-left:24px;margin:8px 0 0;border-top:1px solid var(--line);padding-top:12px}
.cook .alls li.cur{font-weight:700}
@media (min-width:700px){
  .cook .cook-grid{display:grid;grid-template-columns:minmax(260px,2fr) minmax(0,3fr)}
  .cook .cook-ing{max-height:none;border-bottom:none;border-right:1px solid var(--line);padding:16px 18px}
  .cook .cook-steps{padding:18px 22px}
}
.cook .stepcard{font-size:26px;line-height:1.45;padding:10px 0}
.cook .foot{display:flex;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.cook .foot .btn{flex:1;padding:14px;font-size:18px}
.cook label.chk{display:flex;gap:12px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.cook label.chk input{width:24px;height:24px;margin-top:4px}
.cook .done{text-decoration:line-through;color:var(--muted)}
.cook .alls li{cursor:pointer;margin-bottom:10px;font-size:18px}
/* A5 print pages (rendered off-screen, captured to PDF) */
#a5stage{position:absolute;left:0;top:0;z-index:-1}
.a5{width:559px;height:794px;background:#fff;position:relative;color:#1f1b18;font-family:"Source Sans 3",sans-serif;overflow:hidden}
.a5 .body{position:absolute;overflow:hidden}
.a5 .foot{position:absolute;bottom:22px;font-size:9px;color:#8a8079;display:flex;justify-content:space-between}
.a5 h1{font-family:Fraunces,serif;font-size:24px;line-height:1.15;margin:0 0 6px}
.a5 .m{font-size:10.5px;color:#6d635b;margin-bottom:10px}
.a5 h4{font-family:Fraunces,serif;font-size:13.5px;margin:12px 0 4px;color:#9a4424;text-transform:uppercase;letter-spacing:.06em}
.a5 .i{display:flex;gap:8px;font-size:12px;padding:2.5px 0;border-bottom:.5px dotted #d9cfc3}
.a5 .i .q{min-width:74px;font-weight:700}
.a5 .ih{font-weight:700;font-size:12px;padding-top:6px}
.a5 .s{display:flex;gap:8px;font-size:12px;margin:0 0 6px}
.a5 .s .n{font-weight:700;color:#9a4424;min-width:16px}
.a5 .nt{font-size:11.5px;white-space:pre-wrap}
.a5 .aib{border:1.2px dashed #B9A5DC;background:#F6F2FB;border-radius:6px;padding:6px 8px;margin-top:10px;font-size:11px}
.a5 .aib b{color:#6B4FA0}
.a5 .trn{font-size:9.5px;color:#6B4FA0;margin-bottom:6px}
.a5.compact .i,.a5.compact .s{font-size:10.8px}
.a5.compact h1{font-size:21px}
.pdfprev{display:flex;gap:10px;overflow-x:auto;padding:6px 0}
.pdfprev img{height:300px;border:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.08);background:#fff}
</style>
</head>

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else el.setAttribute(k, v === true ? '' : v);

    if (k == null || k === false) continue;
    el.append(k instanceof Node ? k : document.createTextNode(CAT_SET.has(String(k)) ? tx(String(k)) : String(k)));

function toMarkdown(r, lang, factor) {
  const t = trOf(r, lang), lab = L[lang] || L.pl, isOrig = lang === r.lang;
  const lines = ['# ' + titleIn(r, lang), ''];

  if (t) lines.push('_' + lab.tr + ' ' + (LANGS[r.lang] || r.lang) + '_', '');
  const meta = [catLabel(r, false), r.servings ? servText(r.servings * factor, lang) : '', r.prepTime && lab.prep + ': ' + r.prepTime, r.cookTime && lab.cook + ': ' + r.cookTime].filter(Boolean);
  if (meta.length) lines.push(meta.join(' · '), '');
  if (r.tags && r.tags.length) lines.push((lang === 'pl' ? 'Tagi: ' : lang === 'da' ? 'Tags: ' : 'Tags: ') + tagsIn(r, lang === 'da' ? 'en' : lang).join(', '), '');
  lines.push('## ' + lab.ing, '');
  r.ingredients.forEach((ing, i) => {
    const name = (t && t.items && t.items[i]) || ing.item;
    if (ing.header) { lines.push('', '**' + name + '**'); return; }
    const d = displayQty(ing, factor, S.settings.units, lang, isOrig);
    lines.push('- ' + ((d.approx ? '≈ ' : '') + d.q + ' ' + name).trim());
  });
  const steps = (t && t.steps) || r.steps;
  lines.push('', '## ' + lab.steps, '');
  steps.forEach((s, i) => lines.push((i + 1) + '. ' + (S.settings.units !== 'orig' ? convertTemps(s) : s)));
  const hints = (r.ai && r.ai.hints) || [];
  if (hints.length) { lines.push('', '> **✦ ' + lab.ai + '** (' + lab.aiSub + ')'); hints.forEach((x, i) => lines.push('> - ' + ((t && t.hints && t.hints[i]) || x.text))); }
  if (r.notes) lines.push('', '## ' + lab.notes, '', r.notes);
  if (r.source && (r.source.url || r.source.name)) lines.push('', lab.source + ': ' + [r.source.name, r.source.url].filter(Boolean).join(' – '));
  return lines.join('\n');
}

const A5 = { w: 559, h: 794 };
function a5Blocks(item) {
  const { r, lang, factor } = item;
  const t = trOf(r, lang), lab = L[lang] || L.pl, isOrig = lang === r.lang, mode = S.settings.units;
  const blocks = [];
  const meta = [catLabel(r, false), r.servings ? servText(r.servings * factor, lang) : '', r.prepTime && lab.prep + ': ' + r.prepTime, r.cookTime && lab.cook + ': ' + r.cookTime].filter(Boolean).join('  ·  ');
  blocks.push(h('div', null, S.imgs[r.id] ? h('div', { class: 'pimg', style: 'background-image:url("' + imgSrc(r.id).replace(/"/g, '%22') + '")' }) : null, r.aiGenerated ? h('div', { class: 'trn' }, '✦ ' + lab.aiRecipe) : null, t ? h('div', { class: 'trn' }, '✦ ' + lab.tr + ' ' + (LANGS[r.lang] || r.lang)) : null, h('h1', null, titleIn(r, lang)), meta ? h('div', { class: 'm' }, meta) : null));
  let first = true;
  r.ingredients.forEach((ing, i) => {
    const name = (t && t.items && t.items[i]) || ing.item;
    let el;
    if (ing.header) el = h('div', { class: 'ih' }, name);
    else { const d = displayQty(ing, factor, mode, lang, isOrig); el = h('div', { class: 'i' }, h('span', { class: 'q' }, (d.approx ? '≈ ' : '') + d.q), h('span', null, name)); }
    blocks.push(first ? h('div', null, h('h4', null, lab.ing), el) : el); first = false;
  });
  const steps = (t && t.steps) || r.steps;
  steps.forEach((s, i) => {
    const el = h('div', { class: 's' }, h('span', { class: 'n' }, (i + 1) + '.'), h('span', null, mode !== 'orig' ? convertTemps(s) : s));
    blocks.push(i === 0 ? h('div', null, h('h4', null, lab.steps), el) : el);
  });
  const hints = (r.ai && r.ai.hints) || [];
  if (hints.length) blocks.push(h('div', { class: 'aib' }, h('b', null, '✦ ' + lab.ai), ' (' + lab.aiSub + ')', hints.map((x, i) => h('div', { style: 'margin-top:3px' }, '• ' + ((t && t.hints && t.hints[i]) || x.text)))));
  if (r.notes) blocks.push(h('div', null, h('h4', null, lab.notes), h('div', { class: 'nt' }, r.notes)));
  if (r.source && (r.source.name || r.source.url)) blocks.push(h('div', { class: 'm', style: 'margin-top:10px' }, lab.source + ': ' + [r.source.name, r.source.url].filter(Boolean).join(' – ')));

}
function paginate(items, stage) {
  const pages = [];
  const mm = A5.w / 148;
  const inner = Math.round((S.settings.binder ? 20 : 12) * mm), outer = Math.round(12 * mm), top = Math.round(13 * mm), bottom = Math.round(16 * mm);
  for (const it of items) {
    const { blocks, title, hasAi, lab } = a5Blocks(it);
    const recPages = [];
    const newPage = () => {
      const rc = (S.settings.style || 'retro') === 'retro', pc = INKS[S.settings.ink || 'green'] || INKS.green;
      const pg = h('div', { class: 'a5' + (S.settings.compact ? ' compact' : '') + (rc ? ' rc' : ''), style: rc ? `--pc:${pc};--pcl:${pc}55` : '' });
      const body = h('div', { class: 'body', style: `top:${top}px;bottom:${bottom}px;left:${inner}px;right:${outer}px` });
      const foot = h('div', { class: 'foot', style: `left:${inner}px;right:${outer}px` });
      pg.append(body, foot); stage.append(pg); recPages.push({ pg, body, foot }); return body;
    };
    let body = newPage();
    for (const b of blocks) {
      body.append(b);
      if (body.scrollHeight > body.clientHeight + 1 && body.children.length > 1) { b.remove(); body = newPage(); body.append(b); }
    }
    recPages.forEach((p, i) => {
      p.foot.append(h('span', null, title + (hasAi ? '  ·  ' + lab.aiLegend : '')), h('span', null, recPages.length > 1 ? (i + 1) + '/' + recPages.length : ''));
    });
    pages.push(...recPages.map(p => p.pg));
  }
  return pages;
}
